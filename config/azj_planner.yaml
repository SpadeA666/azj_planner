# Azj Planner 配置
#
# 完整参数说明见 PARAMETERS.md（含调参依据、按症状查表、调参工作流）。
# 本文件只保留「改了会出问题」和「不看就不知道什么意思」的关键注释。
#
#   rog_map 段 —— 给 ROG-Map 建图用（本包只读它的 ESDF，不改其源码）
#   azj     段 —— 本规划器自己的参数（最常改的排在最前面）
#
# 核心差别在目标函数形式，不在某个参数取值：
#   EGO/SUPER 把 clearance 当阈值（充足时代价恒为 0 → 必然贴边）
#   这里把 clearance 当连续收益（代价 = 长度 × (1 + w·(ref/c)^alpha)）

rog_map:
  # ⚠ 本段整体照抄 SUPER 能跑通的配置，只改三处必要项：
  #   esdf/enable、esdf/local_update_box、ros_callback 的话题。
  #   raycasting 那一组不能漏：漏了会用默认 p_miss=0.7，
  #   导致 l_miss 为正（"空闲"格子反而增加占据概率）→ 地图糊成一坨。
  resolution: 0.10
  inflation_resolution: 0.10
  # ⚠ 必须是 1（实机 2026-11-26 验证）。此值会双向侵蚀 virtual_ground/ceil：
  #   ground_eff = ground + step×res    ceil_eff = ceil - step×res
  #   实机实测：
  #     step=3 → ground_eff = -0.3+0.3 = **0.0**
  #        → 飞机贴地时 rog_map 报 'Odom below virtual ground' 并**跳过帧**
  #        → 建图失效 → 规划器无数据 → 完全不能用（节点自检会打 FATAL）
  #     step=1 → ground_eff = -0.15、ceil_eff = 1.65  ✓（启动日志已确认）
  #   膨胀职责交给规划器的 robot_radius，别让建图参数兼职。
  inflation_step: 1
  unk_inflation_en: false
  unk_inflation_step: 1
  map_size: [ 15, 15, 6 ]
  fix_map_origin: [ 0, 0, 1.5 ]
  frontier_extraction_en: false

  # z 方向点云裁剪边界。经 inflation_step 侵蚀后的实际值看启动日志
  # "resetMapSize: virtual_ceil_height: X, virtual_ground_height: Y"。
  #   ceil 要 > 最高飞行高度 + 0.5m（否则点云被丢弃）
  #   ground 要 < 0（否则飞机在地面就报警）
  # 飞得更高就把 ceil 往上加（飞 1.5m 时设 2.5）。
  virtual_ceil_height: 1.8
  virtual_ground_height: -0.3

  load_pcd_en: false

  intensity_thresh: -10
  point_filt_num: 1

  raycasting:
    enable: true
    batch_update_size: 1
    local_update_box: [ 8, 8, 6 ]
    # ray_range_min=0.5 滤掉机体近距自反射（机臂/桨）。
    # 但它同时是 free 更新的起点，不能太大（否则飞机周围永不更新为 free）。
    ray_range: [ 0.5, 15 ]
    p_min: 0.12
    # ★ 必须 < 0.5！否则 l_miss 为正，free 更新反向（地图只增不减、糊成一坨）。
    # 启动日志 "[ROG] l_hit: X  l_miss: Y" 两者相同时就是错的。
    p_miss: 0.49
    p_free: 0.499
    p_occ: 0.85
    p_hit: 0.9
    p_max: 0.98
    unk_thresh: 1.0

  map_sliding:
    enable: true
    threshold: 0.3

  esdf:
    enable: true              # ★ 本规划器需要 ESDF（SUPER 走多面体，不用）
    resolution: 0.10
    # ★ 以 odom 为中心的全量重算盒（不是增量！每帧重算整个盒）。
    #   这个框决定"多远范围内的距离场会重算"，也是打点距离的真正上限：
    #   框外 distance_buffer 从没写过（resize 填 0）→ clearance 读到 0 →
    #   日志 "goal clearance=0" + "plan failed: fully blocked"。
    #   z 是全量重算的体积因子，机器吃不消时优先缩 z 或降 resolution，别缩 xy。
    #   ⚠ 必须 ⊆ raycasting/local_update_box，否则会算到"从没建过图"的区域。
    local_update_box: [ 6, 6, 3 ]

  ros_callback:
    enable: true
    # super_data_fix 输出的 map 系点云（已用真值位姿变换）
    cloud_topic: "/super_cloud"
    # ⚠ 必须与点云的变换位姿同源。仿真用 gazebo 真值（脚本会 sed 成这个）。
    #   用 MAVROS 或 LIO 会与 super_data_fix 的变换基准错动 2~9cm → 墙变厚。
    odom_topic: "/gazebo_truth/odom"
    odom_timeout: 2.0

  visualization:
    enable: true
    use_dynamic_reconfigure: false
    time_rate: 2
    frame_rate: 0
    range: [ 15, 15, 8 ]
    frame_id: "map"
    pub_unknown_map_en: false

azj:
  # ══════════════════════════════════════════════════════════════════
  #  ★★★ 最常改的参数（2026-11-26 从文件各处提前到这里）
  #
  #  其余参数按功能分组排在后面。完整说明与调参依据见 PARAMETERS.md。
  # ══════════════════════════════════════════════════════════════════

  # ── 速度 / 加速度 ──
  # ⚠ max_vel / max_acc 在 MINCO 后端下是**软约束**（罚函数，可能被突破），
  #   在 B 样条+TOPP 下是硬约束。想严格不超就把 max_vel 设成上限的 0.8 倍。
  #   实际瓶颈往往不是这几个，而是 rolling_track_acc（仿真 PX4 真实能力）。
  max_vel: 1.0              # 最大水平速度 [m/s]
  max_vel_z: 0.6            # 最大垂直速度 [m/s]
  max_acc: 1.5              # 最大水平加速度 [m/s²]
  max_acc_z: 1.0            # 最大垂直加速度 [m/s²]
  max_lat_acc: 1.2          # 向心加速度，决定转弯限速 [m/s²]

  # ── 安全半径 ──
  # 硬安全半径：clearance 低于它直接拒绝通行（不是软惩罚）。
  # ⚠ 这是手填的数，与真实机体外廓没有绑定。9 寸桨在 380mm 轴距上
  #   桨尖半径 304mm > 0.30m。地面站 3D 的「机体」分组能实时算出真实桨尖半径。
  robot_radius: 0.30
  # 起点逃生区 [m]。飞机停得离墙 0.05m 而安全半径 0.3m 时，
  # 严格按安全半径会拒绝所有邻居 → 永远无法规划。逃生区内只要求 clearance > 0。
  escape_radius: 0.60

  # ── 高度范围 ──
  # 规划可通行的 z 区间。打点高度会被 clamp 到这个范围内。
  # ⚠ ceil_z 是硬上限：打点被 clamp 到上限时若那一层 ESDF 是 0（贴天花板），
  #   目标会被判在障碍里 → 拒绝规划。地面站打点没反应时先查这条。
  floor_z: 0.00
  ceil_z: 1.00

  # ── 话题 ──
  # ⚠ cmd_topic 与 SUPER/EGO 共用，一次只能跑一个规划器。
  cmd_topic: "/planning/pos_cmd"
  # 留空 = 从建图用的那个 odom 的 twist 取速度（推荐，位姿/速度同源）。
  vel_topic: ""
  # odom.twist 是否在**机体系**（实机 faster_lio 是，仿真 gazebo 真值不是）。
  #   仿真 /gazebo_truth/odom  → false（世界系，gz_truth_bridge 直接透传）
  #   实机 /Odometry_highrate   → **true**（laser_mapping.cc 里 rot.conjugate()*vel）
  # ⚠ 当世界系用错时，飞机偏航后速度方向就错 → 轨迹起点速度错。
  odom_twist_body: false
  goal_topic: "/move_base_simple/goal"
  path_topic: "/azj/path"           # nav_msgs/Path，latched
  marker_topic: "/azj/path_marker"
  frame_id: "map"

  # ══════════════════════════════════════════════════════════════════
  #  以下按功能分组（一般不用动）
  # ══════════════════════════════════════════════════════════════════

  # ═══ 搜索 ═══
  resolution: 0.10          # A* 栅格分辨率 [m]
  replan_rate: 15.0         # 重规划检查频率 [Hz]（只在需要时才真重建）

  # ═══ 输出 / 与控制器对接 ═══
  # 发 quadrotor_msgs/PositionCommand，与 SUPER/EGO 同一约定。
  # （cmd_topic / vel_topic 已提前到文件开头）
  publish_rate: 50.0        # [Hz] 必须 > 2（控制器 traj_timeout=0.5s）
  # 只看距离会"带着 0.4m/s 判到位"→ 冲过目标 0.15~0.25m。
  # 速度没降下来就不判到达，继续输出轨迹让它自己刹住。
  arrive_vel_tol: 0.20
  # ★ 0.25→0.15：实测悬停稳态误差 0.226m ≈ 旧值，等于永远停在球边缘。
  arrive_tol: 0.15
  # 固定目标 yaw [rad]。⚠ 设了它 yaw_mode 完全失效（显式指定优先）。
  goal_yaw: .nan
  # 目标高度硬下限 [m]。rviz 在地面点击时 z≈0，不拦就会规划到地面（看着像掉高）。
  min_goal_z: 0.30

  # ═══ 机头朝向 ═══
  #   0 = 跟路径切线（当前点→前方 0.5m 的方向）+ 到点朝消息给的 yaw
  #   1 = 全程保持机头（每帧发当前机头，控制器看不到变化）
  # ⚠ 不要改回"预规划 yaw 曲线按时间索引"：rolling 每 0.1s 重建、start 永远是 now，
  #   traj_t 永远停在 0~0.1s → 永远读到第一个 waypoint → yaw 完全不跟路径。
  yaw_mode: 1

  # 几何切线不可用、退回"朝瞬时速度方向"时的门限 [m/s]。
  # 悬停时残余速度方向是纯噪声（0.05m/s 就能翻 180°）。
  yaw_vel_thresh: 0.15
  # 角度死区 [rad]，抑制"路径微摆→机头跟着摆"（0.05 ≈ 2.9°）
  yaw_deadband: 0.05
  # ⚠ 仅兼容老配置：设 true 会强制把 yaw_mode=1 覆盖成 0。保持 false。
  yaw_follow_velocity: false

  # yaw 参考最大变化率 [rad/s]。到点/悬停时用。
  # ⚠⚠ 1.5 会掉机（2026-11-05 实测：持续偏航后 z 从 0.83 掉到地面）。
  #   机理：四旋翼靠对角电机差速产生偏航力矩，持续大角速度偏航占用推力预算。
  #   改之前必须确认 PX4 侧 px4_yaw_auto_max_deg 与之匹配。
  yaw_rate_max: 1.0

  # 飞行中的偏航角速度上限 [rad/s]。与上面分档的原因：飞行中速度环在抢电机行程。
  # ★ 实测：yaw 速率 0.33 + 水平 1.0 m/s 安全；0.50 就掉高（Δz -0.12→-0.68）。
  #   掉高瞬间 tilt 只有 3~7°，不是倾角损失，是偏航差速吃了悬停油门的余量。
  # 0.25 rad/s ≈ 14°/s。0 = 关闭分档（飞行中也用 yaw_rate_max，不推荐）。
  yaw_rate_flight: 0.25

  # 参考高度比实际高出这个值时暂停转向，全力保高 [m]。0 = 关闭。
  yaw_alt_guard_drop: 0.35

  # 预规划 yaw 曲线的 waypoint 间隔 [s]（与 SUPER 的 interp_dt=2.09s 一致）。
  yaw_profile_dt: 2.1

  # PX4 的 MPC_YAWRAUTO_MAX [deg/s]，用于钳制。0 = 自动读（读不到按 45 兜底）。
  # ⚠ PX4 SITL 重启会恢复出厂 45 —— 用 scripts/set_px4_yaw.sh 重设。
  px4_yaw_auto_max_deg: 180

  # ═══ 重规划触发 ═══
  # 轨迹剩余时间小于它就重规划 [s]。
  # ★ 0.50→0.10：这是"到点过冲"的主因。1m/s 下刹车需 0.67s，
  #   而 0.5s 时轨迹还没进减速段就被丢弃 → v_ref 从 0.62 跳到 0 → 冲过 0.2~0.3m。
  replan_lead: 0.10
  # 偏离参考多少打 WARN [m]。★ 现在**不触发重规划**（学 SUPER 的 NO_NEED）：
  #   飞机跟不上参考是控制器的事，重建轨迹只会破坏参考连续性（实测 0.1s 内重建 7 次 → 掉高）。
  #   真正的重规划由 BLOCKED（前方被挡）和 TRAJ_END（跑完）驱动。
  replan_deviation: 0.50
  # 到点后是否发 COMPLETED。
  # ⚠ true 会让控制器在"位置控制"和"速度控制"间反复切换（实测 COMPLETED 占 65% 帧），
  #   位置控制下再要求转 yaw 就要和位置保持抢电机行程 → 掉高。SUPER 从不发。
  publish_completed_flag: false

  # ═══ 目标点吸附（学 SUPER）═══
  # 打的点落在膨胀层里时，吸附到最近的膨胀层外格子，并留安全余量。
  snap_goal_out_of_inflation: true
  # 吸附搜索半径 [m]。SUPER 用 3.0，我们用 4.0 —— 柱阵里要点偏了能跨过一根柱子。
  goal_snap_search_radius: 4.0
  # 吸附后要求的最小 clearance [m]。0.40 = robot_radius(0.30) + 0.10 余量。
  min_goal_clearance: 0.40

  # ═══ 安全触发（BLOCKED）═══
  # ★ 安全触发的重规划走快通道（跳过曲线优化）：
  #   A* 13~25ms vs 曲线优化 327~1308ms（40~80 倍）。先发折线保证不撞。
  blocked_fast_path: true
  # 快通道之后过了这个时间就主动做一次完整平滑 [s]（不然折线会长期在线）。
  # 0 = 关闭。太小会让轨迹时间基准频繁重置。
  fast_smooth_delay: 0.6

  # BLOCKED 判据：分层阈值（近段严、远段松）+ 滞回。
  # ⚠ 曾经是 0.85/0.55，导致 clearance 掉到 0.151m 才第一次报警（比 robot_radius 低一半）。
  #   "阈值由规划层保证"这个假设是错的 —— 路径会因地图更新而变得不安全，
  #   监控层必须独立把关。现在只比 robot_radius 低 5%/10%。
  safety_near_frac: 0.95
  safety_far_frac: 0.90
  safety_near_span: 0.5
  # 滞回：触发后 clearance 要恢复到此倍才允许再次触发。1.0 = 关闭。
  # clearance 若继续恶化（比锁存时更低）则视为新事件立即重触发。
  safety_hysteresis: 1.05

  # ═══ 热启动（学 SUPER 的 receding horizon）═══
  # 复用旧轨迹的时长 [s]；0 = 关闭
  hot_init_reuse: 1.5
  hot_init_min_len: 0.5       # 引导段最小长度 [m]
  hot_init_max_len: 3.0       # 引导段最大长度 [m]
  hot_init_clear_frac: 0.95   # 引导段要求的 clearance（× robot_radius）

  # ═══ 轨迹后端 ═══
  # 1 = MINCO（默认），0 = B 样条 + TOPP（出问题改回 0 即回到旧行为）
  # MINCO 的核心收益：起点加速度从旧轨迹继承，滚动重建时不会每条都从 a=0 重新加速。
  traj_backend: 1

  # ═══ MINCO ═══
  # 取证 dump 目录。空 = 关闭。★ 支持运行时 rosparam set。
  minco_dump_dir: ""
  minco_w_mid: 30.0       # 居中权重（横扫实测最优）
  minco_w_obs: 50.0       # 安全硬下界的软权重
  minco_w_smooth: 1.0     # jerk 泛函
  minco_iterations: 60    # 实测 4m 段 1.6ms / 10m 段 8ms

  # ═══ 滚动窗口重规划 ═══
  # 总开关。★ 出问题最快的回退手段：设 false 回到 v1.9 全量流程。
  rolling_enable: true

  # ⚠⚠ 必须为 0。这个值是"每次重建时参考点前跳的时长"。
  #   设 0.1 时实测每 0.21s 参考前跳 0.08m（瞬时 4m/s），等效额外推进 0.38m/s
  #   → 参考永远比飞机快 → lag 稳在 0.3~0.6 不收敛（用户报"追不上"）。
  #   改 0.0 后：跳变 82 次→1 次，lag 0.30~0.60 → 0.15。
  #   SUPER 能用 0.1 是因为它同时延后新轨迹 start_WT 保持时间轴连续，我们没有那个机制。
  rolling_forward_dt: 0.0

  rolling_lookahead: 4.0          # 末点前探 [m]（= 滚动窗口长度）
  rolling_lookahead_min: 1.5      # 剩余小于它就直奔 goal [m]
  # 全局路径缓存有效期 [s]。太短会因起点微变选出另一条等价路线（实测 1.19m 位移）。
  rolling_global_ttl: 4.0
  rolling_goal_refresh_dist: 0.50 # 目标移动超过它才重建全局路径 [m]

  # 末端居中的梯度上升（0 = 关闭）
  rolling_center_iters: 8
  rolling_center_step: 0.08       # 每次步长 [m]
  rolling_center_max_shift: 0.60  # 末端最大横移 [m]
  rolling_center_lateral_only: true # 只在垂直前进方向回中
  rolling_snap_end: true

  # 连续滚动周期 [s]。0.1 = 10Hz，这就是"一直向梯度最低衍生"的机制。
  # ★ 两个前提必须同时满足，否则出相反问题（已各踩一次）：
  #   ① 起点取旧轨迹前沿 → 参考才领先飞机
  #   ② 高频重建 → 领先量才不累积
  rolling_period: 0.10

  # ── 参考速度限制（治"路径跑太快追不上"）──
  # rolling 段的可跟踪加速度 [m/s²]。★ 这是仿真 PX4 的实测真实能力，
  #   往往才是"实际能飞多快"的瓶颈，不是 max_acc。
  #   只影响 rolling 段，不改全局 max_acc（实机 PX4 能力更强）。
  rolling_track_acc: 1.0
  rolling_v_lead: 0.05      # 参考允许领先飞机的量 [m/s]（0.63 会横偏离翻倍）
  # A* 的 clearance 余量倍数（给 MINCO 平滑切角留空间）。
  # 1.3 让折线离障碍 0.39m，切角后仍有 ~0.3 余量。找不到路会自动退回 1.0。
  rolling_astar_margin: 1.30
  rolling_receding_dis: 2.0 # 从旧轨迹继承的引导段长度 [m]

  # ── 落后时的降速反馈 ──
  rolling_lag_free: 0.35    # 死区 [m]，放过正常跟踪误差（稳态约 0.3~0.4）
  rolling_lag_gain: 1.0     # 增益 [1/s]（2.0 实测反而更抖：0.56 vs 0.13）
  rolling_v_floor: 0.25     # v_cap 下限 [m/s]，不能归零（否则自举失败）
  # ★ v_allow = max_vel - (lag - free) × 本值。0 = 关闭。
  #   实测 0.0 会冲过目标 1.56m，0.5 正常停在 14.05m，同时消除历史遗留的过冲。
  rolling_lag_vel_gain: 0.50

  # BLOCKED 时的退避上限 [s]（只防同帧重复进入，不是安全延迟）
  blocked_replan_period: 0.10
  safety_lookahead: 1.50    # 前方安全监控前瞻 [s]
  # 重规划最小间隔 [s]，机制性防活锁兜底。rolling 会用 rolling_period 做退避。
  min_replan_period: 0.30

  # ═══ 2D / 3D 模式 ═══
  # true = 只在 XY 平面规划，z 锁在**目标高度**。★ 支持运行时 rosparam set。
  # 2D 下 A* 所有邻居（含起点）都被强制设到规划平面；ceil_z 是硬上限，
  # 打点高度被 clamp 到上限时若那层 ESDF 是 0（贴天花板）→ 目标判在障碍里 → 拒规划。
  plan_2d: true
  # 薄层厚度 [m]。0 = 单层 ESDF 不投影（投影会把穿框的孔压成实心）。
  plan_2d_slab_half: 0.0
  plan_2d_z_samples: 9

  # ═══ 层高约束 ═══
  # （floor_z / ceil_z 已提前到文件开头）
  enforce_height_limits: true
  w_height: 2.00            # 高度保持软权重
  height_ref_offset: 0.0    # 参考高度 = 起终点平均高度 + 该偏移
  height_scale: 1.0         # dz 归一化尺度 [m]
  height_band: 0.15         # 软带宽度
  w_height_band: 20.0       # 超出软带后的强罚
  z_band: 0.20              # 高度硬约束带，|z-参考| 超出即不可通行（0=关闭）

  # ═══ 曲线优化（traj_backend=0 或 MINCO 回退时用）═══
  curve_enable: true
  curve_sample_step: 0.05   # 按弧长重采样的点间距 [m]
  curve_w_mid: 1.0          # 居中权重
  curve_w_obs: 50.0         # 避障权重
  curve_w_smooth: 1.0       # 平滑权重
  curve_w_anchor: 0.5       # 保形权重（别偏离 A* 太多）
  curve_w_len: 0.05         # 长度权重
  curve_samples: 140
  curve_iterations: 120     # 默认路径（长，但形状好）
  curve_iterations_quick: 80 # 快通道的迭代数
  curve_stall_iters: 8      # 连续无改善多少次提前退出
  curve_control_point_spacing: 0.30
  curve_enable_projection: true
  curve_projection_iters: 2
  curve_projection_samples: 240
  curve_enable_local_centering: true
  curve_local_scan_radius: 2.0
  max_curvature: 20.0       # 曲率上限 [1/m]，超了按 v=sqrt(max_lat_acc/kmax) 降速
  curvature_tolerance: 3.0  # 曲率容差倍数，超过则拒绝曲线

  # ═══ 输出侧硬钳制（防掉高的最后防线，不要随便放开）═══
  max_vel_z_out: 0.30       # 输出 vz 硬限幅 [m/s]
  vel_blend_time: 0.35      # 速度淡入时间 [s]。★ rolling 下自动禁用
  # ★ 无论轨迹层怎么生成，控制器都不会看到超能力加速度前馈 [m/s²]
  acc_feedforward_limit: 1.5
  # ★★ 参考速度的变化率上限 [m/s²] = max_acc × 1.5。0 = 关闭。
  #   实测重规划瞬间参考速度方向在 0.05s 内转 41°（变化率 14 m/s²，是 max_acc 的 9 倍）
  #   → 控制器只能饱和 → 姿态被拽偏 → z 从 0.774 掉到 0.001。
  ref_vel_rate_limit: 2.25

  # ═══ 起点 / anchor（重规划连续性的核心）═══
  # false = anchor 用飞机自身状态（位置按规划耗时外推）→ 轨迹生效时参考就在飞机身上，无断层。
  # ⚠ true 是 SUPER 式（旧轨迹前视点），只在"规划耗时 <100ms"时才成立。
  #   我们规划要 0.7~1.8s，前视就变成"前方 0.7~1.0m"，实测断层 0.91~1.51m
  #   → 飞机必须加速去追断层 → 速度不平滑、机身抖动。保持 false。
  anchor_from_trajectory: false
  anchor_max_dev: 0.30      # 开启上面那项时的偏离上限 [m]
  # anchor 在规划开始时算、结束时用，耗时长就落后。按实测耗时外推补偿 [m]。0=关闭。
  plan_anchor_catchup_max: 0.5
  # ★ realign 复用旧路径的门槛 [m]。超过就走完整 A* 重搜。
  #   实测偏离 0.8m 仍复用时插了 0.815m 过渡段 → 掉高。0.25 ≈ 2 个栅格。
  realign_max_gap: 0.25
  ref_start_max_dev: 1.5    # 新起点允许偏离已提交参考的最大距离 [m]

  # ═══ 折线兜底（曲线被拒 / 快通道时）═══
  # 折线原本完全没有居中（实测 min_clr=0.126 = robot_radius 的 42%）。
  # 开启后也做"沿 ∇c 爬山到剖面最宽处"。实测 45° 斜通道：clr 0.151→0.969、走到正中。
  fallback_center_enable: true
  fallback_center_skip_clear: 1.2  # 已经这么宽就不动 [m]

  # ⚠ 只在 3D 模式有效。2D 模式下 PillarClearanceField 在 slab_half=0 时
  #   完全忽略 p.z，直接用规划平面查 clearance，抬升 start.z 不影响判定。
  ground_lift_max: 0.40

  # 优先用三次 Hermite 做 C1 过渡（关掉 = 直线连接，会断层）
  hermite_preferred: true

  # ═══ 失败兜底 ═══
  # 目标方向与当前速度夹角超此值先刹车，再接路径 [度]。180 = 关闭。
  # 全速冲向身后目标直接转向 → 加速度阶跃 → 掉高。
  brake_angle_deg: 55.0
  brake_angle_min_speed: 0.3    # 低于此速度不做急转判断 [m/s]
  backup_enable: true           # 规划失败时生成可控刹车轨迹
  backup_min_speed: 0.15        # 低于此速度不生成刹车段 [m/s]

  # ═══ 居中（核心理念）═══
  # （robot_radius / escape_radius 已提前到文件开头）
  # 代价 = 长度 × (1 + w · (ref / clamp(c, ·, cap))^alpha)
  # ⚠ traj_backend=1 时实际居中由 minco_w_mid 主导，这组主要作用于 B 样条后端。
  clearance_weight: 0.15    # w：0 = 纯最短（退化成 EGO 行为）
  clearance_ref: 1.0        # ref：归一化基准 [m]
  clearance_cap: 2.0        # cap：超过它不再奖励，防绕远
  alpha: 2.0                # 居中锐度

  # ═══ A* 搜索框 ═══
  box_margin_x: 2.5         # 起终点包围盒外扩 [m]
  box_margin_y: 2.5
  box_margin_z: 0.8
  goal_tolerance: 0.30      # 目标吸附容差 [m]
  max_expansions: 400000    # 搜索节点上限（防病态场景炸内存）

  # ═══ 未知区处理 ═══
  # ⚠ unknown_as_free=true 是危险的：未建图区当成自由空间，会往未知区撞。
  unknown_as_free: false
  free_clearance_if_unknown: 0.5    # 仅当上面为 true 时生效
  unknown_clearance_cap: 0.32       # 未知区 clearance 上限
