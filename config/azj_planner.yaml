# Azj Planner 配置
#
# 说明：
#   rog_map 段是给 ROG-Map 建图用的（本包只读它的 ESDF，不修改其源码）。
#   azj 段是本规划器自己的参数。
#
# 与 SUPER/EGO 的差别在于**目标函数的形式**，不在某个参数的取值：
#   它们把 clearance 当阈值（充足时代价恒为 0 → 贴边）；
#   这里把 clearance 当连续收益（代价 = 长度 × (1 + w·(ref/c)^alpha)）。
# 长度仍是主目标，居中是有界修正，所以 w 保持在 0.05~0.2 量级。

rog_map:
  # ⚠ 本段整体照抄 SUPER 能跑通的配置（super_planner/config/click_smooth_ros1.yaml），
  #   只改三处必要项：esdf/enable、esdf/local_update_box、ros_callback 的话题。
  #
  #   为什么必须照抄 raycasting 那一组：曾漏掉它，用了 rog_map 的默认值
  #   p_miss=0.7 → l_miss = log(0.7/0.3) = +0.847（**正数**），
  #   意味着 raycast 穿过的"空闲"格子反而在增加占据概率。
  #   结果整个房间只增不减，全被填成实心 —— 表现就是建图糊成一坨、
  #   任何位置 clearance 都只有 0.03~0.09m、规划器报 fully blocked。
  #   启动日志里能直接看出来："[ROG] l_hit: 0.847  l_miss: 0.847"（两者相同即错）。
  resolution: 0.10
  inflation_resolution: 0.10
  # ★ 必须是 1。这个值会**双向侵蚀** virtual_ground/ceil_height
  #   （rog_map config.hpp:407 起）：
  #     ground_eff = ground + inflation_step*resolution
  #     ceil_eff   = ceil   - inflation_step*resolution
  #   设 3 就是各吃 0.3m —— 实测配 ceil=1.0/ground=-0.2 时
  #   实际变成 ceil=0.65/ground=0.15，飞机飞 0.8 直接"above virtual ceil"，
  #   整帧点云被丢弃、地图永远空。
  #   膨胀的职责交给规划器的 robot_radius，不要让建图参数兼职。
  inflation_step: 1
  unk_inflation_en: false
  unk_inflation_step: 1
  map_size: [ 50, 50, 6 ]
  fix_map_origin: [ 0, 0, 1.5 ]
  frontier_extraction_en: false

  # z 方向点云裁剪边界。
  #
  # ⚠ 这两个值经过 inflation_step 侵蚀后才是真正生效的（见上面 inflation_step 说明）：
  #   ground_eff = floor(ground/res)*res + step*res + 0.05
  #   ceil_eff   = floor(ceil /res)*res - step*res - 0.05
  # 节点启动日志会打印 "resetMapSize: virtual_ceil_height: X, virtual_ground_height: Y"，
  # 那是**实际生效值**，以它为准。
  #
  # 要求：
  #   · ceil_eff  > 最高飞行高度 + 0.5m   （否则点云被丢弃）
  #   · ground_eff < 0                    （否则飞机在地面时就报警）
  # 当前 inflation_step=1 时：
  #   ceil 1.8 → eff 1.65   ground -0.3 → eff -0.15
  # 飞得更高就把 ceil 往上加（比如飞 1.5m 时设 2.5）。
  virtual_ceil_height: 1.8
  virtual_ground_height: -0.3

  load_pcd_en: false

  intensity_thresh: -10
  point_filt_num: 1

  raycasting:
    enable: true
    batch_update_size: 1
    local_update_box: [ 100, 100, 5 ]
    # ray_range_min=0.5 滤掉机体近距自反射（机臂/桨）。
    # 注意 ray_range 同时决定 free 更新的起点，不能太大，
    # 否则飞机周围一圈永远不更新为 free。
    ray_range: [ 0.5, 15 ]
    p_min: 0.12
    p_miss: 0.49        # ★ 必须 < 0.5！否则 l_miss 为正，free 更新反向
    p_free: 0.499
    p_occ: 0.85
    p_hit: 0.9
    p_max: 0.98
    unk_thresh: 1.0

  map_sliding:
    enable: true
    threshold: 0.3

  esdf:
    enable: true              # ★ 本规划器需要 ESDF（SUPER 不用，它走多面体）
    resolution: 0.10
    # ★ 以 odom 为中心的全量重算盒（不是增量！`updateESDF3D` 每帧重算整个盒）。
    #
    # 原来的 [8,8,4] 只有半径 4m，而打点常在 10~15m 外：盒外的
    # distance_buffer 从未被写过（vector<double> resize 填 0），
    # evaluateEDT 插值读到一片 0 → clearance 变 0 →
    # 日志 `goal clearance=0` + `plan failed: fully blocked`。
    #
    # xy 取 32（**半径 16m**）覆盖实际打点距离 —— 实测用户会打到 15m 外，
    # 半径 12m 时目标已在盒外，路径后段全在未建图区（详见
    # `azj_planner_node.cpp:clearanceAt` 里盒外返回 -1 的注释）。
    # z 只需覆盖 floor_z..ceil_z 加膨胀（实测 map z bounds ≈ [-0.2,1.6]），
    # 所以 z=2 就够，不必跟着 xy 放大 —— z 是全量重算的体积因子。
    # 体积 = 320×320×20 = 2.05M 格。
    # 若机器吃不消，优先缩 z 或降 resolution，别缩 xy（会重新出现“目标在盒外”）。
    local_update_box: [ 32, 32, 2 ]

  ros_callback:
    enable: true
    # cloud_topic：super_data_fix 输出的 map 系点云（已用真值位姿变换）
    cloud_topic: "/super_cloud"
    # odom_topic：**必须与点云的变换位姿同源**。
    #   仿真用 gazebo 真值，脚本会把这里 sed 成 /gazebo_truth/odom。
    #   若用 MAVROS 或 LIO，会与 super_data_fix 的变换基准产生 2~9cm 相对错动，
    #   点云在每帧被放到略微不同的位置，墙就变厚。
    odom_topic: "/gazebo_truth/odom"
    odom_timeout: 2.0

  visualization:
    enable: true
    use_dynamic_reconfigure: false
    time_rate: 2
    frame_rate: 0
    range: [ 15, 15, 8 ]
    frame_id: "map"
    pub_unknown_map_en: false

azj:
  # ---- 搜索 ----
  resolution: 0.10          # A* 栅格分辨率
  replan_rate: 15.0          # 重规划检查频率 [Hz]（注意：只在需要时才真重建轨迹）

  # ---- 输出 / 与控制器对接 ----
  # 发布 quadrotor_msgs/PositionCommand，与 SUPER/EGO 同一约定。
  # as_controller 的 navigationIso / navigationContour / navigationOMMPC 可直接跟踪。
  # ⚠ cmd_topic 与 SUPER/EGO 共用，一次只能跑一个规划器。
  cmd_topic: "/planning/pos_cmd"
  publish_rate: 50.0        # 参考点发布频率 [Hz]，必须 > 2Hz（控制器 traj_timeout=0.5s）
  # 速度反馈话题。**留空 = 从建图用的那个 odom 的 twist 取速度**（推荐）。
  # 这样仿真(/gazebo_truth/odom)与真机(mavros odom)都不用改，且位姿/速度严格同源。
  # 只有需要独立速度源时才填，例如 /mavros/local_position/velocity_local
  vel_topic: ""
  arrive_vel_tol: 0.20      # 到达判定速度上限 [m/s]。
                            # ★ 只看距离会导致“带着 0.4m/s 判到位”→ 冲过目标 0.15~0.25m。
                            #   速度未降时不判到达，继续输出轨迹让它自己刹住。
  arrive_tol: 0.15          # 到达判定距离 [m]
                            # ★ 0.25 → 0.15（2026-11-05）：实测悬停稳态误差
                            #   0.226m ≈ 旧 arrive_tol 0.25，即飞机一进 0.25m 球
                            #   就被判“到达”并丢弃轨迹，于是**永远停在球边缘**。
                            #   实测误差能收敛到 0.037~0.149m，所以 0.15 可达。
  # 固定目标 yaw [rad]。**设了它 yaw_mode 就完全失效** —— 显式指定优先。
  # 用途：投放/拍照要求机头恒定朝某个方向时。平时留 nan。
  goal_yaw: .nan

  # 目标高度硬下限 [m]（2026-11-14 新增）。
  #
  # rviz 的“2D Nav Goal”在地面平面点击时 z≈0；不拦就会让规划器
  # “合法地”规划到地面，看起来就是掉高。低于这个值会被抬上来。
  # 建议 = floor_z + 0.3 左右。nan = 关闭（保持旧行为）。
  min_goal_z: 0.30

  # ── 机头朝向控制（2026-11-05）──
  #
  #   0 = HOLD   全程不转，保持起飞时的机头
  #   1 = VELOCITY   全程朝速度方向（EGO/SUPER 行为，穿越时最常用）
  #   2 = GOAL       全程朝**目标点方位角**
  #                  ⚠ 不是"朝路径切线"。目标是远方一个点，方位角飞行中几乎不变
  #                    → 机头基本固定指向目标。路径为绕障侧移/后退时，
  #                    机头**不会**跟着转（会侧飞甚至倒飞）。
  #                    且到点 0.3m 内不再更新，所以也**不是**精确对准。
  #                    适用：短距直线飞行、悬停观察某点；不适合穿越。
  #   3 = VELOCITY_THEN_MSG
  #                  飞行中朝速度方向；到点后转成消息朝向。
  #                  ⚠ 2026-11-14 第二次实测：即使修好推力基准，mode 3 在
  #                    "满速飞行 + 路径转弯"时仍会因偏航差速吃推力而掉高。
  #                    yaw_rate_flight 已降到 0.25 并加倾角自适应；
  #                    若仍偶发，用 mode 4（飞行不转）——360° 雷达下视野无损失。
  #                  2026-11-14 修复掉高后恢复推荐：
  #                    · 飞行中限速 yaw_rate_flight=0.5（不再 1.0）
  #                    · yaw 曲线起点接到当前机头，不再一上轨迹就转 80°
  #                    · 掉高保护：参考比实际高 0.35m 时暂停转向
  #                    · 不再无条件发 COMPLETED（控制器不再切位置控制）
  #                  若仍观察到掉高，先用 mode=4 做 A/B 对照定位。
  #   4 = HOLD_THEN_MSG   ★ 推荐
  #                  飞行中完全不转；到点后转成打点消息给的朝向。
  #                  打点时在 rviz 里按住拖方向，即可指定终点机头。
  #
  # ── ⚠ 为什么"飞行中偏航"（mode 1/2/3）会掉高 ──
  #
  # 实测对照（2026-11-05，柱林，同一目标点）：
  #   yaw_mode=0 → 不掉高
  #   yaw_mode=3 → z 从 0.94 掉到 0.00；sp_vz 顶在 +0.70 限幅仍爬不动
  #
  # 排除过（都有数据支撑）：
  #   · 规划器 yaw 指令平滑，单帧最大 0.012 rad，无阶跃
  #   · 控制器转发正确，sp.yaw 与 cmd.yaw 差 0.000
  #   · mavros 与 gazebo 的 yaw 一致（差 0.002），无坐标系错位
  #   · PX4 偏航参数正常（MC_YAW_P=2.8，MC_YAWRATE_MAX=200deg/s）
  #
  # 机制：PX4 四旋翼每个电机都叠加 throttle/roll/pitch/yaw 四个分量
  #   （quad_x mixer）。飞行中 cmd.yaw 一直在变（柱林里速度方向频繁改），
  #   实测实际 yaw **持续落后指令 26~30°**（不是瞬时，是稳态偏差）
  #   → 姿态环持续输出偏航力矩 → 电机差速持续占用行程 → 推力下降。
  #   关键不是"转得快"，而是"跟踪误差持续存在"。
  #
  # 取舍：本项目雷达 360° 全向，"机头朝飞行方向"的视野收益很小；
  #   掉高是安全问题。所以推荐 mode 4：飞行段不转，到点后（速度≈0，
  #   无速度需求竞争）再转向指定朝向。
  yaw_mode: 0

  # 速度门限 [m/s]：低于它不跟随（仅 mode=1）。
  # 悬停/微调时速度方向是纯噪声 —— 实测 0.05m/s 的残余速度方向能翻 180°，
  # 跟着转会左右抖。
  yaw_vel_thresh: 0.15

  # 角度死区 [rad]：目标与当前夹角小于它就不动（0.05 ≈ 2.9°）。
  # 抑制"路径微摆 → 机头跟着摆"。
  yaw_deadband: 0.05

  # ⚠ 下面这个是为兼容老配置保留的。yaw_mode=0 且它为 true 时等价于 yaw_mode=1。
  # 新配置直接用 yaw_mode，不用管它。
  yaw_follow_velocity: false

  # yaw 参考最大变化率 [rad/s]。
  #
  # ⚠⚠ 1.5 会掉机！2026-11-05 实测事故（务必读完再改）：
  #   偏航角速度持续 1.45~1.48 rad/s 转约 1 秒后，飞机 z 从 0.83 掉到地面。
  #   同期 PX4 一直在执行 +0.70m/s 爬升指令，实际 vz=-1.62（超过
  #   MPC_Z_VEL_MAX_DN=1.0，已不受速度环控制）；姿态正常、未撞柱、
  #   PX4 高度估计准确（误差<0.15m）。
  #
  #   机理：四旋翼靠对角电机差速产生偏航力矩，持续大角速度偏航会占用推力预算，
  #   转向与爬升同时拉满时总升力不足。
  #   对照：yaw 不动的 18 分钟飞行里 |yaw_rate|>0.3 仅 23 帧，且此时高度仍在爬升。
  #
  # 0.5 rad/s ≈ 29°/s，转 180° 需 6.3 秒。慢，但推力不塌。
  # ★ 2026-11-09：改回 1.5，与 SUPER 的 yaw_dot_max 完全一致。
  #   这个值同时决定**预规划 yaw 的 waypoint 间隔**：
  #       step = π / yaw_rate_max = π/1.5 = 2.09s（与 SUPER 的 interp_dt 同）
  #   调大会让 waypoint 更密（yaw 参考更"活"），调小会更稀疏（更稳但滞后）。
  #   要和 SUPER 对齐就别动这个值。
  # ⚠⚠ 3.0 会掉高！2026-11-09 实测事故：
  #   PX4 的 MPC_YAWRAUTO_MAX = 45 deg/s = 0.785 rad/s，而这里给 3.0，
  #   指令角速度是 PX4 能力的 **3.8 倍** → 飞机永远追不上 →
  #   实测稳态误差 **103°**（cmd=-2.66, act=+1.83）→
  #   PX4 持续饱和输出偏航力矩 → 电机行程被吃光 → 推力不足 → 掉高。
  #
  #   危险场景：到点后转向 / 打点落在膨胀层被吸附到旁边时，
  #   需要较大的角度变化，这个误差会直接暴露出来。
  #
  # ★ 2026-11-09 二次调整：PX4 的 MPC_YAWRAUTO_MAX 已从出厂 45 deg/s
  #   提到 180 deg/s (= 3.14 rad/s)，所以这里可以给到 2.0。
  #   2.0 / 3.14 = 64%，留 36% 余量 —— 比 76% 更保守，因为角速度越高
  #   电机差速占用的行程越多，余量要留得更足。
  #
  #   参考：0.6 → 转 180° 需 5.2s；1.5 → 2.1s；2.0 → 1.6s。
  #
  #   改这个值之前**必须**先确认 PX4 侧 px4_yaw_auto_max_deg 与之匹配，
  #   否则 clampYawRateMax() 会按 PX4 能力自动钳制（并打 WARN）。
  yaw_rate_max: 1.0

  # ── 飞行中偏航角速度上限 [rad/s]（2026-11-14 新增）──
  #
  # 与 yaw_rate_max 分档的理由：
  #   yaw_rate_max    → 到点/悬停时用（速度环无竞争，可快速对准）
  #   yaw_rate_flight → 飞行中用（速度环正在抢电机行程）
  #
  # 实测依据（yaw1_before_rate_fix.bag t=19.25~21.0）：
  #   cmd yaw 以 1.0 rad/s 转 80°，PX4 实际落后 43°；
  #   同段 z 从 0.85 掉到 0.01（truth vz=-1.8 m/s，sp_vz 已顶在 +0.70）；
  #   roll/pitch 只有 ±11° → 不是姿态失控，是偏航力矩吃掉推力预算。
  #
  # ★★ 0.5 → 0.25（2026-11-14 第二次实测，有完整数据支撑）
  #
  # 实测（/tmp/azj_flight_20261114_123622/flight.bag，yaw_mode=3）：
  #   同一架飞机、同一个 SITL、同一次飞行，只用 yaw 速率区分安全与否：
  #
  #     yaw 速率   水平速度    Δz/秒       结果
  #     0.00~0.19   1.00      ±0.02      安全（第一点，路径近直线）
  #     0.29        0.16      -0.03      安全（减速中）
  #     0.99        0.00      -0.003     安全（到点悬停，大转也不掉！）
  #     0.33        1.00      +0.018     安全
  #     0.50        1.00      -0.12→-0.68   ✗ 掉高
  #
  # 掉高瞬间 tilt 只有 3~7°（cos(tilt)=0.996）→ 不是倾角损失，
  # 是偏航差速在"悬停油门 0.871 只剩 12.9% 行程"里撞顶，净推力下降。
  #
  # 0.25 rad/s ≈ 14°/s，转 90° 需 6.3s。比 0.5 更保守 —— 实测 0.33 安全、
  # 0.50 掉，取 0.25 留 25% 余量。另外代码里还有**倾角自适应**：
  # tilt 30° 时会再乘 0.3（见 computeYaw 里的说明）。
  #
  # 0 = 关闭分档（飞行中也用 yaw_rate_max，不推荐）。
  yaw_rate_flight: 0.25

  # ── 掉高保护阈值 [m]（2026-11-14 新增）──
  # 参考高度比实际高出这个值时，暂停偏航转向，全力保高。
  # 安全优先的兑底：航向没有安全重要。0 = 关闭。
  yaw_alt_guard_drop: 0.35

  # 预规划 yaw 曲线的 waypoint 间隔 [s]。
  # 与 SUPER 的 `interp_dt = π/yaw_dot_max`（yaw_dot_max=1.5 → 2.09s）一致。
  #
  # ★ 与 yaw_rate_max **解耦**：
  #   yaw_rate_max    = 每帧转角限幅，受 PX4 能力约束
  #   yaw_profile_dt  = 参考曲线 waypoint 稀疏度，只影响平滑程度
  # 绑在一起会互相牵制（详见 buildYawProfile 的注释）。
  yaw_profile_dt: 2.1

  # PX4 的 MPC_YAWRAUTO_MAX [deg/s]，用于 clampYawRateMax() 钳制。
  # 必须与 PX4 侧实际值一致，否则钳制会算错。
  # 0 = 自动从 mavros 读（读不到按 45 兜底）。
  # ⚠ PX4 SITL 重启会恢复出厂 45 —— 用 scripts/set_px4_yaw.sh 重设。
  px4_yaw_auto_max_deg: 180
  replan_lead: 0.10         # 轨迹剩余时间小于它就重规划 [s]
                            # ★ 0.50 → 0.10（2026-11-05）：这是“到点过冲”的主因。
                            #   1.0m/s 下刹车距离 = v²/(2a) = 0.33m、需 0.67s，
                            #   而 replan_lead=0.5s 时轨迹**还没进入减速段就被丢弃**
                            #   重规划 → v_ref 从 0.62 直接跳 0（实测断崖），
                            #   飞机以 0.6~1.0m/s 凭 PX4 位置环硬刹车 → 冲过 0.2~0.3m。
                            #   0.10s 让轨迹先完成减速，过冲基本消失。
                            #   安全性不受影响：障碍侵入由 needReplan (c) 独立触发。
  # 偏离参考点多少才重规划 [m]（2026-11-14 语义变更）。
  #
  # ★ 现在 DEVIATED **不再触发重规划**（学 SUPER 的 NO_NEED）：
  #   飞机跟不上参考是控制器 PD 的事，规划器重建轨迹只会破坏参考连续性。
  #   实测 15Hz 下灾难（/tmp/azj_flight_20261114_154400）：
  #     rel_t=9.88~10.55  0.1 秒内 **7 次**轨迹重建（tid 2→9）
  #     新轨迹速度一路递增 (0.11,-0.21)→…→(0.69,-0.56)
  #     rel_t=11.0 z 从 0.588 掉到 0.499（vz=-0.74）
  #   原因：重对齐用"旧轨迹参考"起步，飞机落后 0.5m → 参考仍在 0.5m 前
  #   → 下周期 still deviated → 又重置 → 速度指令叠加 → 掉高。
  #
  # 现在这个值只用于**日志提示**（超过它打 WARN），不触发重规划。
  # 真正的重规划由 BLOCKED（前方被挡）和 TRAJ_END（轨迹跑完）驱动。
  replan_deviation: 0.50
  # ★ 到点后是否发 COMPLETED（2026-11-09，实测这是 yaw 掉高的根因）
  #
  # 控制器 api_3d.cpp:794 按 trajectory_flag 分两个控制模式：
  #   COMPLETED → HOLD 分支：mask=3064 位置控制（PX/PY/PZ 有效）
  #   READY     → 主分支  ：mask=3015 速度控制（VX/VY/VZ 有效）
  #
  # 实测 azj 有 65% 的帧在发 COMPLETED（READY 35% / COMPLETED 65%），
  # 控制器就在位置控制和速度控制之间反复切换。位置控制模式下 PX4 用位置环
  # 算姿态+推力，此时再要求转 yaw 就要和位置保持争夺电机行程 → 掉高。
  # 这解释了为什么 yaw_mode=0 看不出问题、一开 yaw 就掉。
  #
  # SUPER 从不发 COMPLETED（fsm_ros1.hpp:155 `on_backup_traj ? 2 : 1`，
  # 连 stop_cmd 也是 flag=1）→ 控制器 100% 速度控制 → 不掉高。
  #
  # 默认 false（对齐 SUPER）。非 rviz 的点到点任务若靠 COMPLETED 判到达，
  # 设 true 恢复旧行为。
  #
  # ★ 2026-11-14：这个开关现在**真正生效了**。之前 publishTick() 在轨迹
  #   跑完时无条件发 COMPLETED，绕过了本参数 —— 即使设 false，控制器仍有
  #   大量帧走 HOLD 位置控制（实测 mask 在 3015/3064 间反复切换）。
  #   现已统一受本参数控制。
  publish_completed_flag: false

  # ══════════════════════════════════════════════════════════════════
  # 目标点吸附（2026-11-09，学 SUPER 的现成方案）
  #
  # 需求：打的点即使落在膨胀层里，也要能规划出路径，但**终点必须停在
  #       膨胀层外并留安全距离**，而不是硬冲进障碍。
  #
  # SUPER 的做法（直接借用，避免踩坑）：
  #   super_planner/src/super_core/fsm.cpp:191
  #     getNearestInfCellNot(GridType::OCCUPIED, click_point, gi_.goal_p, 3.0)
  #   rog_map/src/rog_map.cpp:105 findNearestInfCellThat
  #     → 预生成 spherical_neighbor 偏移表（半径 5m，**按距离升序**），
  #       从近到远找第一个「膨胀层外」的格子。
  #     → 找不到则报 "Goal is deeply occupied, skip this goal" 丢弃。
  #
  # 本规划器额外加一层（SUPER 没有）：安全距离余量 min_goal_clearance。
  #   SUPER 只保证 clearance >= robot_radius，我们要求更多余量
  #   （理念：安全优先，终点也应留白）。
  # ══════════════════════════════════════════════════════════════════
  snap_goal_out_of_inflation: true

  # 吸附搜索半径 [m]。SUPER 用 3.0；我们用 4.0 ——
  # 柱阵里柱子净距约 1.2m，用户点偏时要能跨过一根柱子。
  goal_snap_search_radius: 4.0

  # 吸附后要求的最小 clearance [m]。0 = 只要出膨胀层（与 SUPER 一致）。
  # 0.40 = robot_radius(0.30) + 0.10 余量。
  min_goal_clearance: 0.40

  blocked_fast_path: true   # ★ 安全触发的重规划走快通道（跳过曲线优化）。
                            #   实测 A* 13~25ms vs 曲线优化 327~1308ms（40~80 倍）。
                            #   紧急时用平滑度换响应速度：先发折线保证不撞，
                            #   下一次常规重规划再出完整曲线替换。
                            #   关掉=false 则退回旧行为（响应 ~1.3s）。
  # ── 快通道折线的主动平滑 [s]（2026-11-14 新增）──
  #
  # 背景：BLOCKED（雷达扫出新障碍）时故意跳过曲线优化，30ms 出折线保安全，
  # 日志承诺 "next replan will smooth it"。但那个"下一次"原来靠
  # TRAJ_END / DEVIATED 偶然触发 —— 实测 raicom 3D 里折线在线 4.2 秒，
  # 而且替换时曲线又被 kmax 拒掉，等于从未平滑过。
  #
  # 现在：fast path 之后过了这个时间，只要当前不是 BLOCKED，
  # 就主动发起一次完整规划（走曲线优化）。
  #
  # 0.6s 的依据：够飞机脱离刚扫出的障碍，又不至于让折线长期在线。
  # 太小会让轨迹时间基准频繁重置（参考点永远停在轨迹前段）。
  # 0 = 关闭（退回旧行为）。
  fast_smooth_delay: 0.6

  # ══════════════════════════════════════════════════════════════════
  #  BLOCKED 判据（2026-11-14 大改，学 SUPER 的离散膨胀格语义）
  #
  #  ★ 旧判据 `clearance < robot_radius` 会在阈值上反复抖动：
  #    曲线优化的最优解本来就收敛到 c ≈ robot_radius（w_obs hinge 在
  #    c < safe_margin 时才罚），实测日志 `min_clearance=0.3m (safe 0.3m)`。
  #    再叠加 unknown_clearance_cap=0.32 只比 robot_radius 高 0.02，
  #    前方未建图区 ESDF 一更新就跌破 → 每 3 秒一次 BLOCKED。
  #    实测（13:23 日志）：
  #      37.026 BLOCKED→折线 ; 37.950 曲线 ; 40.150 BLOCKED→折线 ; 41.249 曲线
  #    这就是"a*重规划和曲线的切换之间震荡"。
  #
  #  ★ SUPER 的做法（super_planner.cpp:454）
  #    `getInfGridType(pt) == OCCUPIED || OUT_OF_MAP` —— 判**离散膨胀格占用**，
  #    路径只要在膨胀格外就绝不触发，天然有 1 格(0.1m)量化余量。
  #    而且前瞻只到 replan_forward_dt=0.1s（不是 1.5s）。
  #
  #  ★ 本实现：分层阈值 + 滞回
  #    近段（0~near_span）  robot_radius × near_frac = 0.30×0.85 = 0.255m
  #    远段（~lookahead）   robot_radius × far_frac  = 0.30×0.55 = 0.165m
  #    远处放松是因为那里的 ESDF 可能还没建好（未知区 cap=0.32）。
  #    监控层的职责是"发现新出现的硬障碍"，不是"卡安全阈值"——
  #    阈值已由规划层保证（路径 min_clr >= robot_radius）。
  # ⚠⚠ 2026-11-14 事故后收紧：曾经是 0.85 / 0.55，导致 clearance 掉到 0.151m
  #    才第一次报警（比 robot_radius 低一半），飞机已经撞上。
  #    "阈值由规划层保证"这个假设是错的 —— 路径会因地图更新而变得不安全，
  #    监控层必须独立把关。
  #    现在只比 robot_radius 低 5%/10%，兼顾"避开浮点抖动"和"及时报警"。
  # ══════════════════════════════════════════════════════════════════
  #  轨迹拼接 + backup（2026-11-14，学 SUPER 的 cmd_traj / backup_traj）
  #
  #  ① 参考连续起步：新轨迹从**旧轨迹在 t_now 的状态**起步（不是飞机实际位置）。
  #     这是"切换轨迹瞬间掉高"的根治 —— 参考点连续，控制器看不到速度阶跃。
  #     前几轮修复失效的原因：只对齐了位置，而位置和速度都过期 1 秒。
  #  ② 规划失败时生成**可控刹车轨迹**（等价 SUPER 的 backup_traj）。
  #     比"停发参考让控制器超时急刹"平滑得多。
  # ══════════════════════════════════════════════════════════════════

  # ★ 贴地起点的最大抬升量 [m]（2026-11-14）
  #
  # 飞机趴在地面时，起点 ESDF 恒为 0（地面点云 + 机体自反射），
  # 而 A* 的 `start_clr > 0` 判据会一直失败 → **规划器完全瘫痪**。
  #
  # 实测（/tmp/azj_flight_20261114_214929）：
  #   t=36.99~51.99 连续 15 次 `plan failed: start is inside an obstacle`
  #   旧实现只抬 0.05m，而 clearance 在 0.05 处仍是 0.000
  #
  # 现在改为**逐步抬升直到 clearance > 0**，最多抬到这么多。
  # 抬到上限仍无间隙 → 说明真的被障碍包住 → 拒绝规划（正确）。
  # 0.40 ≈ robot_radius + 0.1，够穿过地面噪声层。
  #
  # ⚠ **只在 3D 模式有效。** 2D 模式的 PillarClearanceField 在
  #   `plan_2d_slab_half=0` 时**完全忽略 p.z**，直接用规划平面查 clearance，
  #   所以抬升 start.z 不影响 2D 的判定。
  #   2D 下贴地能规划是靠 A* 的起点判据放宽到 `clearance >= 0`（见
  #   path_search.cpp 的说明）。
  ground_lift_max: 0.40

  # ══════════════════════════════════════════════════════════════════
  #  ★★★ anchor 来源（2026-11-16 重大转向：从"飞机当前位置"重规划）
  #
  #  false（默认）：anchor = 飞机自己的状态（位置+速度），位置按规划耗时外推。
  #    → 轨迹生效时参考点就在飞机身上，无断层。
  #
  #  true：SUPER 式（旧轨迹未来时刻的 pos+vel 整组）。
  #    ⚠ 只在"规划耗时 <100ms"时才成立 —— SUPER 靠 0.3ms 的规划速度
  #      让 0.1s 前视 ≈ 飞机当前位置。我们规划 0.7~1.8s，
  #      前视就变成"前方 0.7~1.0m"，实测断层 0.91~1.51m：
  #        t=3.40  tid 1→2  cmd(-2.22,-1.21) 飞机(-2.48,-0.33) 断层 0.914m
  #        t=7.0   断层 1.510m 且 |cmdV|=0
  #      → 飞机必须加速去追断层 → 速度不平滑、机身抖动。
  anchor_from_trajectory: false
  # 若开启上面那项，只在前视点离飞机 < 该距离时才用（否则用飞机自身状态）
  anchor_max_dev: 0.30

  # ★ anchor 过期补偿上限 [m]（2026-11-14）
  #
  # `plan_anchor_` 在规划**开始**时算，而 buildTrajectory 在规划**结束**时用。
  # 实测某次规划耗时 1.78s，飞机飞了 1.6m → anchor 落后 0.8m
  # → C1 过渡段硬补这 0.8m → 曲线 kmax 从 3 涨到 395 → 曲线被拒
  # → 退回**折线**（折线没有居中）→ 用户看到"靠近一侧障碍"。
  #
  # 现在按"实际耗时 − 预期耗时"沿原飞行方向外推 anchor 补偿。
  # 0 = 关闭。
  plan_anchor_catchup_max: 0.5

  # ★ 折线回退的居中修正（2026-11-14，核心理念兜底）
  #
  # 曲线被拒 / fast path 时退回折线，而折线原本**完全没有居中**：
  #   实测折线 min_clr=0.126（robot_radius 的 42%），同一场景曲线是 0.451。
  # 开启后折线也做"沿 ∇c 爬山到剖面最宽处" —— 这才是两侧等距的中线。
  #
  # 实测（45° 斜通道，半净宽 1.0m，路径贴墙 d=+0.85）：
  #   居中前 clr=0.151 / d=+0.849
  #   居中后 clr=0.969 / d=-0.031   ← 走到正中
  fallback_center_enable: true
  # 已经这么宽就不动（避免空旷处乱晃）[m]
  fallback_center_skip_clear: 1.2
  #
  # ⚠ 2026-11-16 修正了两个让居中**从未生效**的 bug：
  #   ① 只在 simplify 后的稀疏顶点上爬山 → 改按 0.05m 稠密重采样
  #   ② 判据用**整条路径**的 min clearance，而起点贴障碍（0.12）
  #      把 min 压住 → 中间点从 0.151 提到 0.969 也被判"无改进"
  #      → 改看**中间段**（排除首尾各 8%）
  # 实测（起点贴障碍场景）：
  #   旧判据：全程 min 0.120→0.120 → 「无改进」→ 居中结果被丢弃
  #   新判据：中间段 min 0.151→0.969 → 「改进」→ 采纳，中点 d=-0.031（正中）

  # ★★ 加速度前馈钳制 [m/s²]（2026-11-16，治重规划掉高的真凶）
  #
  # 实测（/tmp/azj_flight_20261116_224359）：
  #   t=35.650  refAx  1.57  refAy  0.44
  #   t=35.675  refAx  9.55  refAy **13.40**   ← 轨迹切换瞬间
  #   t=35.875  refAx **-21.69** refAy -11.76
  # 控制器 `nav_ff_acc_ * acceleration` 作前馈 → spVy 0.05s 内从 -1.25 跳到 +1.11
  # → roll 5.1° → **-48.6°** → cos(48.6)=0.66 → 垂直推力 15.4N < 重力 17.72N → 掉高
  #
  # 根因是轨迹层：五次 Hermite 的加速度公式分组错误（v 项被多除一个 h）
  # 让 max|a| 达到 402 m/s²，加上端点硬置零。已在 trajectory.cpp 修好
  # （现在实测 max|a| = 1.50 = max_acc 精确上限）。
  # 这里再加一道**发布侧硬钳制**：无论轨迹层怎么生成，控制器都不会看到超能力前馈。
  acc_feedforward_limit: 1.5

  # ★ 参考速度的变化率上限 [m/s²]（2026-11-16，治重规划掉高）
  #
  # 实测（/tmp/azj_flight_20261116_220405）：
  #   t=40.20  refV (-0.22,-0.97)  tid=1
  #   t=40.25  refV (-0.74,-0.48)  tid=2   ← 方向差 41°，0.05s 内
  #   → 变化率 ≈ **14 m/s²**，是 max_acc(1.5) 的 9 倍
  #   → 控制器 sp 从 (0.79,-0.93) 翻到 (-1.43,-0.10)
  #   → roll 6.5° → -17.5° → 推重比 1.32 撑不住 → z 0.774 → 0.001
  #
  # 无论轨迹怎么生成，**发布出去的参考必须是物理可达的**。
  # 飞机加速度能力就是 max_acc —— 参考跑得更快，控制器只能饱和，
  # 姿态被拽偏，掉高。
  #
  # 2.25 = max_acc × 1.5，给正常加速段留余量（轨迹本身按 1.0 规划）。
  # 0 = 关闭。
  ref_vel_rate_limit: 2.25

  # ★ realign 复用旧路径的门槛 [m]（2026-11-16）
  #
  # 实测：飞机偏离旧路径 0.8m 时 realign 仍复用它 →
  # buildTrajectory 插 0.815m 的 C1 过渡段（z 差 0.82m 时尤其糟）→ 掉高。
  # 超过这个距离就改走完整 A* 规划（从当前位置重新搜）。
  # 0.25m ≈ 2 个栅格，够容纳正常跟踪误差。
  realign_max_gap: 0.25

  # 新轨迹起点允许偏离"已提交参考"的最大距离 [m]。
  # 超过就用飞机实际位置起步（说明飞机已严重跟不上）。
  ref_start_max_dev: 1.5

  # ★★ 优先用 Hermite 平滑轨迹（2026-11-14，对齐 SUPER 的 MINCO）
  #
  # true（默认）：起点速度作为**完整矢量**约束 → 轨迹能"边走边转弯"。
  #   实测（单元测试 [11]）：飞机 1 m/s 朝 +X，路径要求掉头 180°，
  #   t=0 速度仍为 (1.000, 0)，t=0.1s 位置 x=+0.12（先顺惯性），
  #   然后形成 U 型平滑掉头，全程无停顿。
  #
  # false：退回"急转时先刹停再转"（下面的 brake_angle_deg）。
  #   实测会卡顿 0.34~1.0s（/tmp/azj_flight_20261114_153350 里 TURN 触发 7 次）。
  #
  # 这是 TOPP（沿弧长速度标量）→ Hermite（起点速度矢量）的表示升级，
  # 等价于 SUPER 用 MINCO 多项式表达 (p, v, a) 起点约束。
  hermite_preferred: true

  # ★ 急转前先刹车（仅当 hermite_preferred=false 作为兜底）
  #
  # 场景：未知建图区新扫出障碍，路径需要在起点处急转甚至掉头。
  # 物理约束：飞机此刻有 1 m/s 动量，而推重比只有 1.32（悬停油门 0.871），
  #   "一边高速前进一边急转"会吃光姿态余量 → 掉高。
  # 实测 t=44.39：cmd 速度 (0.71,-0.70) → (-0.23,-0.95)，方向差 70.8°，
  #   z 从 0.782 掉到 0.515（0.27m）。
  #
  # 修法：夹角超过阈值时，先拼一段**沿当前速度的刹车段**（减速到静止），
  #   再接路径。飞机先平滑减速 → 低速下转向 → 不掉高。
  #   = SUPER 的 "guide 段 + backup" 在 azj 上的等价实现。
  # 设 180 = 关闭（永不刹车，任何角度都直接转）。
  brake_angle_deg: 55.0
  # 速度低于此值不做急转判断 [m/s]
  brake_angle_min_speed: 0.3

  # 规划失败时生成可控刹车轨迹（关闭 = 退回"停发参考→控制器急刹"）
  backup_enable: true
  # 低于这个速度不生成刹车段 [m/s]
  backup_min_speed: 0.15

  safety_near_frac: 0.95
  safety_far_frac: 0.90
  safety_near_span: 0.5
  # 滞回：触发 BLOCKED 后，clearance 必须恢复到 robot_radius×该系数才允许
  # 再次因 clearance 触发。1.0 = 关闭。
  # ★ 但 clearance 若**继续恶化**（比锁存时更低），视为新事件立即重触发。
  #   上一版的全局锁存会让飞机贴着障碍飞时再也不报警（实测只触发 1 次）。
  safety_hysteresis: 1.05

  # ══════════════════════════════════════════════════════════════════
  #  热启动（hot init / receding horizon）★ 学 SUPER 最关键的一处
  #
  #  SUPER（super_planner.cpp:379 generateExpTraj）：
  #    · 把上一条已提交轨迹当引导路径（guide_path）
  #    · 沿它采样查膨胀格，畅通时 split_dis=max → **整条旧轨迹保留**
  #    · A* 只规划末端→目标那一小段
  #    · 用 guide_path 作**优化初值**（热启动）
  #
  #  为什么这决定"优化快不快"：
  #    初值本身已在一条**平滑可行**的曲线上（旧轨迹就是优化出来的），
  #    梯度几步收敛。冷启动的初值是 A* 折线 —— 45°/90° 硬角，
  #    必须迭代几十次才能压平（实测 60 次 850ms / 150 次 2069ms）。
  #
  #  azj 对应实现：
  #    1) A* 之前沿旧轨迹取一段**当前畅通**的引导段
  #    2) A* 只规划「引导段末端 → 目标」
  #    3) 合并两者作为曲线优化初值
  hot_init_reuse: 1.5        # 复用旧轨迹的时长 [s]；0 = 关闭热启动
  hot_init_min_len: 0.5      # 引导段最小长度 [m]，太短没意义
  hot_init_max_len: 3.0      # 引导段最大长度 [m]，防止搜索空间过小
  hot_init_clear_frac: 0.95  # 引导段要求的 clearance（× robot_radius）

  # ══════════════════ 滚动窗口重规划（rolling，2026-11-17，学 SUPER）════════
  #
  # 核心变化：不再每次重规划都做「anchor → goal 全量 A* + 整条曲线」。
  #   起点 = 飞机实际位置 + forward_dt 前视（硬约束 p,v）
  #   末点 = 沿全局路径前探 lookahead 米（receding horizon）
  #   末端 = 每次重算 clearance 梯度上升 → 推到通道中轴（“末端引导居中”）
  #   段内 stop_at_end=false → 局部目标处不减速（速度连续）
  #   全局 A* 有缓存，只在 goal 变 / TTL 过期时重跑
  #
  # 实测（本机 24 核，离线 bench，柱子/横墙场景）：
  #   seg 3.9~4.2m、curve 1~4ms、min_clr 0.75~0.80m（robot_radius 0.30）
  #   A* 缓存命中时 0 开销；重建 1.3ms
  # 关闭本开关（rolling_enable: false）即回到 v1.9 的全量流程。
  # ── 轨迹后端（2026-11-17）──
  # 0 = B 样条 + TOPP（curve_optimizer，起点只约束 v）
  # 1 = MINCO s=4（起点硬约束 p/v/a/j，形状与时间联合优化）
  #
  # ★ 为什么默认 1：rolling 每 0.1s 重建轨迹，而 B 样条不约束起点加速度，
  #   每条新轨迹都从 a=0 靠 max_acc 重新加速 → 速度永远停在加速段
  #   （实测 |v0| 恒 0.285，而 max_vel=1.0）。
  #   MINCO 的 setConditions(headPVAJ) 把"我正以 a 加速"告诉优化器，结构性解决。
  #   出问题改回 0 即回到旧行为，无需改代码。
  traj_backend: 1

  # MINCO 居中权重。30 是横扫实测最优（直通道半宽 1.5m、初值偏 0.8m，
  # 60 迭代做到横向不平衡 0.05m、min_clr 1.473/1.5）。
  # 含义：居中权重 = jerk 能量的 30 倍 —— 对应"不珍惜时间空间，只要安全居中"。
  # MINCO 输入/输出完整 dump（2026-11-25）。
  # 设成目录（如 /tmp/azj_minco_dump）后，每次 MINCO 调用写一个文本文件：
  #   输入路径逐点 + clearance
  #   输出轨迹逐点 + clearance
  #   三道校验的判定值与阈值
  #   优化参数（w_mid / w_obs / iterations / lock_z ...）
  #   环境 clearance 网格（可离线复现，不依赖 bag 里的点云帧）
  # 空字符串 = 关闭（生产用）。
  minco_dump_dir: ""
  minco_w_mid: 30.0
  minco_w_obs: 50.0       # 安全硬下界的软权重
  minco_w_smooth: 1.0     # jerk 泛函
  minco_iterations: 60    # 实测 4m 段 1.6ms / 10m 段 8ms

  rolling_enable: true
  rolling_forward_dt: 0.0
  # ★ 必须为 0（2026-11-17 定论）。这个值是"每次重建时参考点前跳的时长"。
  #   设 0.1 时实测每 0.21s 参考前跳 0.08m（瞬时 4 m/s），等效额外推进 0.38 m/s
  #   → 参考永远比飞机快 → lag 稳在 0.3~0.6 不收敛（用户报"追不上"）。
  #   改 0.0 后：跳变 82 次→1 次，lag 0.30~0.60 → 0.15，飞机位移 14.33m。
  #   SUPER 能用 0.1 是因为它同时延后轨迹 start_WT 保持时间轴连续，我们没有那个机制。
  rolling_lookahead: 4.0       # 末点前探 [m]（= 滚动窗口长度）
  rolling_lookahead_min: 1.5   # 剩余小于它就直奔 goal [m]
  rolling_global_ttl: 4.0
                            # 全局路径缓存有效期 [s]。1.5 太短：实测每 1.5s 重跑
                            # A* 会因起点微变选出**另一条等价绕行路线**
                            # （t=4.58 那次位移 1.19m）。地图没变时旧路径仍然
                            # 有效，延长到 4.0。真正需要重建的情形（目标变 /
                            # 起点真偏离 / 被挡）另有判据，不依赖 TTL。
  rolling_goal_refresh_dist: 0.50  # 目标移动超过它才重建全局路径 [m]
  rolling_center_iters: 8      # 末端居中的梯度上升迭代数（0=关闭）
  rolling_center_step: 0.08    # 每次步长 [m]
  rolling_center_max_shift: 0.60   # 末端最大横移 [m]
  rolling_center_lateral_only: true  # 只在垂直于前进方向的平面内回中
  rolling_snap_end: true
  # 连续滚动周期 [s]。0.1 = 10Hz，这就是「一直向梯度最低衍生」的机制：
  #   每 0.1s 重新做一次「末点前探 + 末端居中梯度上升 + 短段优化」，
  #   而不是等飞机飞到末点（TRAJ_END）才更新。
  #
  # ★ 两个前提必须同时满足，否则会出相反的问题（已各踩一次）：
  #   ① 起点取旧轨迹前沿（领先 forward_dt=0.1s）→ 参考点才领先飞机
  #   ② 高频重建（本项 0.1s）→ 领先量才不累积
  # 只满足①（稀疏重建）→ 飞机落后越来越大（实测 0.52→2.50m）
  # 只满足②（起点取飞机位置）→ 参考贴着飞机，速度趋 0（实测 0.13 m/s）
  rolling_period: 0.10

  # ── 参考速度限制（2026-11-17，治"路径跑太快追不上"）──
  # 实测：飞机 0.42 m/s，参考被顶到 1.0 → lag 从 0 涨到 1.63m 持续发散。
  # 原因：max_acc=1.5 与仿真 PX4 实际能力（~0.4 m/s²）差近 4 倍。
  # 规则：v0 <= 飞机速度 + track_acc*forward_dt - (lag - lag_free)*gain
  #
  # rolling_track_acc：rolling 段的可跟踪加速度 [m/s²]。
  #   bag 实测仿真 PX4：t=35.45 开始动 → t=36.27 达 0.92 m/s（0.82s）
  #   → 加速度 ≈ 1.12 m/s²；稳态速度约 1.28 m/s（超过 max_vel=1.0）。
  #   取 1.0（略保守于实测，留余量）。
  #   ★ 只影响 rolling 段，不改全局 max_acc=1.5（实机 PX4 能力更强）。
  #   实测：track_acc 0.8/1.0/1.1 三者 lag 无差异（0.54 是控制器稳态误差），
  #   说明真正起作用的是下面的 lag 反馈，本项只做上界保护。
  rolling_track_acc: 1.0
  # 参考速度允许领先飞机的量 [m/s]。实测 0.05 最好（0.63 会横偏离翻倍）。
  rolling_v_lead: 0.05
  # A* 的 clearance 余量倍数（给 MINCO 平滑切角留空间）。
  # 1.0 = 关闭。实测 1.0 时 A* 路径 clearance 恰好 0.30，
  # MINCO 段内切角压到 0.0039 → 连续被拒 → 折线。
  # 1.3 让折线离障碍 0.39m，切角后仍有 ~0.3 余量。
  # 找不到路会自动退回 1.0，窄缝场景不会瘫痪。
  rolling_astar_margin: 1.30
  # 从旧轨迹继承的引导段长度 [m]（学 SUPER 的 receding_dis）。
  # 新轨迹前 N 米直接沿用旧轨迹几何 → 切换时空间重合 → 无横向突变。
  # 0 = 关闭。2.0 在 1m/s 下约 2s 前视，覆盖一个滚动周期又留足重规划余地。
  rolling_receding_dis: 2.0
  rolling_lag_free: 0.35   # 死区 [m]，放过正常跟踪误差（实测稳态约 0.3~0.4）
  rolling_lag_gain: 1.0    # 增益 [1/s]；2.0 实测反而更抖（0.56 vs 0.13）
  rolling_v_floor: 0.25    # v_cap 下限 [m/s]，不能归零（否则自举失败）
  # 轨迹**整体**速度上限的 lag 衰减 [m/s per m]：v_allow = max_vel - (lag-free)*gain
  # 只限起点速度不够：MINCO 轨迹中段仍会跑到 max_vel，落后时参考照样满速，
  # lag 只能"不恶化"不能收敛（实测稳在 0.87m）。
  # ★ 横扫实测（PI 控制器 bench）：0.0 → lag 0.36 但**冲过目标 1.56m**；
  #   0.5 → lag 0.30 且正常停在目标； 1.0 → lag 0.34。
  #   0.5 同时解决"lag 收敛"与"到点过冲"（历史遗留问题）。
  rolling_lag_vel_gain: 0.50

  blocked_replan_period: 0.10  # 安全触发(BLOCKED)时的退避上限 [s]
                            # ★ 它不是安全延迟，只防同一帧重复进入。
                            #   原来 BLOCKED 也要等 min_replan_period=0.3s，
                            #   叠加规划 0.33~1.31s → 总延迟 1.6s，墙扫出来了却不避。
  safety_lookahead: 1.50    # 前方安全监控前瞻 [s]
                            # ★ 0.50 → 1.50：前瞻必须覆盖“规划耗时”才有意义。
                            #   规划要 0.33~1.31s，只往前看 0.5s(=0.5m@1m/s) 时，
                            #   等算完新路径飞机已经飞过那段了。
                            #   1.5s 能提前发现并启动重规划。
  min_replan_period: 0.30   # 重规划最小间隔 [s]。机制性防活锁兜底：
                            #   实测一次完整规划 1.5~1.7s，不影响正常重规划；
                            #   只在"规划→被拒→重规划"异常循环时刹车，
                            #   防止主线程 100% CPU 导致 /planning/pos_cmd 断流

  # ---- 2D / 3D 模式 ----
  # false = 完整 3D 规划（默认）
  # true  = 只在 XY 平面规划，高度锁在**目标高度**
  #
  # 运行时切换（无需重启）：
  #   rosparam set /azj_planner/plan_2d true     # 切 2D
  #   rosparam set /azj_planner/plan_2d false    # 切 3D
  # 下一重规划周期生效，并自动重建轨迹。
  plan_2d: true

  # 2D 模式的 clearance 处理。
  #
  # ★ 默认不做投影（slab_half: 0.0）：2D 就是用 z=规划平面 那一层的**真实 3D ESDF**。
  #
  #   为什么不做投影（关键设计取舍）：
  #     柱状投影把 z 方向压扁，会连"垂直方向的空隙"一起压掉。
  #     典型例子：穿框 —— 框的孔在规划层是空的，投影把框上下沿压到同一平面后
  #     孔变成实心，"本来有空间却没有空间了"。
  #     实测：单层能穿过方孔（绕行比 1.00），柱状 ±0.5 直接 NO_PATH。
  #
  #   为什么不担心漏掉桌子/横梁：
  #     飞机严格在规划平面飞行，桌子（z 0~0.5）和横梁（z 1.1~1.5）
  #     根本撞不到，本就不该参与该层判定。
  #
  #   想留一点垂直余量（机体厚度/控制误差）就设 0.05~0.15。
  #   ⚠ 不要超过 robot_radius：一旦覆盖到地板/天花板，
  #     每列 clearance 会被压到 ~0，整个平面判死，A* 只能贴残缝绕远
  #     （实测路径 40m、曲率 66、间隙 7mm）。
  plan_2d_slab_half: 0.0
  plan_2d_z_samples: 9

  # ---- 规划层高约束（★ 这个才管规划，virtual_* 只管点云裁剪）----
  # ⚠ 务必分清：
  #   rog_map/virtual_ground_height / virtual_ceil_height
  #       = 点云裁剪边界。**不约束规划**。改它们不会改变路径高度。
  #   azj/floor_z / azj/ceil_z
  #       = 规划可通行空间。低于 floor_z 或高于 ceil_z 一律判不可通行。
  #
  # 不给这两个值的话，A* 会从地板下面 / 天花板上方抄近路
  # （那片区域没有点云 → UNKNOWN → 按 unknown_clearance_cap 判成可通行）。
  enforce_height_limits: true

  # 最低可规划高度 [m]。**给多少，路径就会贴到多少** —— 它是一条硬边界，
  # 边界下面没有代价可罚，所以路径会毫不犹豫地贴着它走。
  #
  # 实测（长墙堵死、唯一"出路"是钻地板）：
  #   floor_z=-0.20 → 路径 zmin=-0.164  （钻到地板下 16cm）
  #   floor_z=-0.10 → 路径 zmin=-0.081  （钻 8cm）
  #   floor_z=-0.02 → NO_PATH           （地板拦住，正确）
  # ★ 所以要设成**地板高度本身**，不要留负余量。
  #   raicom 场景地面在 z=0 → 设 0.0。
  #   如果场景整体抬高（地面在 0.5），这里也要跟着改成 0.5。
  floor_z: 0.00

  # 最高可规划高度 [m]。同上，路径会贴着它走。
  # 建议 = 飞行高度 + 0.5 ~ 1.0（留出爬升/绕高的余量），
  # 但不要超过地图的 virtual_ceil_height（超出部分没地图，会被误判为空旷，
  # 反而让路径往上飞）。超了会被自动钳制并打 WARN。
  ceil_z: 1.00

  # 高度保持权重。0 = 关闭（z 方向完全自由，会贴边界走）。
  #
  # ★ 0.50 → 2.0（2026-11-05 实测）。原因：
  #   飞机打点后先冲到 z=1.0076（天花板），再花 8 秒掉回 0.80。
  #   日志 `path z=[0.05, 0.999289]` —— 路径自己爬到了天花板。
  #   定量：height_ref=0.80，z=1.0 时 dz=0.2，
  #        代价只增加 len × 0.50 × 0.04 = len × 0.02（2%），
  #        压不住 A* 追求更大 clearance 的倾向。
  #   查过柱子高度：/rog_map/occ 的 z 从 -0.05 到 1.55，各高度点数是均匀的
  #   （每 0.2m 约 1000 点）→ 0.8 和 1.0 的几何 clearance 本来就一样，
  #   爬高没有任何实际收益。
  w_height: 2.00
  height_ref_offset: 0.0    # 参考高度 = 起终点平均高度 + 该偏移
  height_scale: 1.0         # dz 归一化尺度 [m]

  # ★ 高度豁免带 + 带外强罚（压住"往下钻"的关键）
  #
  # 为什么必须有：只靠 w_height 的二次项压不住。
  # 实测 raicom 场景（飞机 0.52、目标 0.80）：
  #   clearance 0.3 → 0.5 时，代价因子 2.11 → 1.40，净省 0.71/m
  #   而高度偏离 0.6m，w_height=0.5 只罚 0.18/m
  #   → 净省 0.53/m，A* 必然下降到 z=0.04（地面附近是 UNKNOWN，
  #     被 unknown_clearance_cap 高估成"宽敞"）
  #
  # 机制：|z-ref| <= height_band 只受温和的 w_height；
  #       超出后按 (excess)^2 * w_height_band 强罚。
  #       excess=0.3m 时罚 20*0.09 = 1.8/m，足以压过 clearance 收益。
  # 0.30 → 0.15（2026-11-05）：配合 w_height 收紧，让强罚更早触发。
  # 柱林场景里上下绕障不可能（柱子高 1.55m、天花板 1.0m），
  # 收紧高度约束没有副作用。
  height_band: 0.15
  w_height_band: 20.0

  # ★★ 高度硬约束带 [m]：|z - 参考高度| 超过它**直接判不可通行**。
  #
  # 为什么软惩罚不够（实测）：
  #   造"矮墙 z0.6~1.0 挡住目标高度、下方 z<0.6 空旷"的场景，
  #   A* 宁可从墙下钻（z=0.346，到地面 clearance 0.346，代价因子 1.84），
  #   也不从侧面绕 —— 因为贴墙时 clearance=0.15，代价因子高达 5.44。
  #   差距 3.6/m。而 w_height_band=20 在 excess=0.154 时只罚 0.47/m；
  #   加到 100 也只有 2.37/m，仍不够，再大就压死真实升降需求。
  #   → 必须硬约束。
  #
  # 效果（同一场景）：
  #   z_band=0   → 路径 z=[0.346,0.835]，23 个点在 z<0.5（往下钻）
  #   z_band=0.40 → 路径 z=[0.783,0.956]，**0 个点在 z<0.5**，改从侧面绕
  #
  # 参考高度 = (起点z + 目标z)/2 + height_ref_offset。
  # 0 = 关闭（退回纯软约束）。
  # 给多大：至少要能容纳"从当前高度爬升到目标高度"的一半跨度，
  # 否则会 NO_PATH。
  #
  # ★ 0.40 → 0.20（2026-11-05 实测）。
  #   0.40 时允许 |z-0.80| <= 0.40 → [0.4, 1.2]，被 ceil_z=1.0 截断，
  #   于是 A* 有整整 0.2m 的爬高空间，实测就爬到 0.999289。
  #   收到 0.20 → [0.6, 1.0]，把这段无收益的爬高空间堵掉。
  #   ⚠ 起点在低处（起飞/掉高恢复）时仍会走 A* 的"起点爬升通道"，
  #     不受 z_band 限制，所以不会 NO_PATH。
  z_band: 0.20

  # ---- 曲线优化（折线 → C2 连续三次 B 样条）----
  # 关闭后退回"简化+平滑"的折线，只用于对照。
  curve_enable: true
  curve_sample_step: 0.05   # 曲线按弧长重采样的点间距 [m]

  # ★ w_mid 是「两侧等距」理念的数学表达：
  #   通道横截面上 clearance = min(左距,右距)，min 只在两侧相等时取到
  #   该剖面最大值。所以最大化 mean((ref/c)^α) 会自动把路径推到中轴，
  #   不需要额外的对称项。又因 min 不可微，两侧不等时梯度只反映较近
  #   一侧，天然形成"回中"反馈。
  #   实测（45°通道，半净宽1.0m，起终点各偏0.7m）：
  #     w_mid=1.0 → 中段横向偏移 0.0002m，两侧距离差 0.0004m
  curve_w_mid: 1.0
  # 安全 hinge 权重：c < safe_margin(=robot_radius) 时强罚
  curve_w_obs: 50.0
  # 平滑（控制点二阶差分）
  curve_w_smooth: 1.0
  # 锚定：防止曲线整体漂移。曾无此项时长度暴涨 46%。
  curve_w_anchor: 0.5
  # 长度约束：超过初始长度 2% 才生效，防"为了更宽而绕远"
  curve_w_len: 0.05
  # 采样点数 / 迭代次数
  # ★ 140 → 70（2026-11-16 提速）
  #
  # 采样间隔不该小于 **ESDF 分辨率**（esdf/resolution = 0.10m）：
  # 比它更密时，相邻 2~3 个采样点落在同一个 voxel 里，
  # 三线性插值结果几乎相同 —— 纯属重复计算。
  #
  # 140 个点对 5m 路径 = 3.6cm 间距（< 0.1m）→ 至少 1/3 是浪费。
  # 70 个点 = 7cm 间距，仍略密于 ESDF 分辨率，精度无损。
  curve_samples: 140
  # ★★ 2026-11-17：编译优化修复后，把为提速牺牲的质量**全部要回来**
  #
  # 根因找到了：catkin 默认不设 CMAKE_BUILD_TYPE → 一直是 **-O0** 编译，
  # 而 SUPER 的 CMakeLists 明确写 `set(CMAKE_CXX_FLAGS "-O3 ...")`。
  # Eigen 重度依赖内联，-O0 下慢 100~200 倍。
  #
  # 实测（同一份代码、同一场景，只改编译选项）：
  #   iters=150 samples=140:  2087ms → 16.3ms   （128 倍）
  #                            6266ms → 28.3ms   （223 倍）
  #   iters=60  samples=70 :   894ms →  5.0ms
  #
  # 所以之前为了压耗时做的降采样、降迭代**已经没必要**，全部回退：
  #   实测质量对比（场景2，绕障 10.8m）：
  #     iters=60  samples=70  → min_clr=0.659  max_curv=1.95
  #     iters=150 samples=140 → min_clr=0.700  max_curv=1.60   ← 更安全、更平滑
  #   而耗时只多 15ms（16.3 vs 28.3），相比 ESDF 更新 137ms 微不足道。
  #
  # 取值：150 是测试基准值；生产用 120 留余量（实测 ~20ms）。
  #
  # --- 以下为历史记录（-O0 时代的权衡，现已被上面取代）---
  # ★ 60 → 35（2026-11-16 提速，实测质量无损）
  #
  # 曲线优化占单次规划耗时的 99.7%（astar=2.7ms vs curve=895ms）。
  # 而"规划慢"是掉高/不居中的共同根因：
  #   规划 900ms → 飞机飞 0.9m → anchor 断层 0.9m
  #   → C1 过渡段暴涨 → 曲线 kmax 爆炸被拒 → 退回不居中的折线
  #   → 同时控制器为追断层把 sp 打满 1.60（实测 30.9% 帧饱和）→ 大 tilt → 掉高
  #
  # 实测对比（curve_optimizer_test，长通道 9.2m）：
  #   iters=60 samples=140 → 894ms  min_clr=0.300  mid=0.0004
  #   iters=60 samples=70  → 610ms  min_clr=0.300  mid=0.0007
  #   iters=35 samples=70  → 363ms  min_clr=0.300  mid=0.0007   ← 采用
  # 三个指标里 min_clr 与居中都没变，只有迭代次数少了。
  # （samples 从 140 降 70 的依据：采样间隔不该小于 ESDF 分辨率 0.10m）
  curve_iterations: 120

  # ---- 输出速度保护（避免重规划瞬间掉高）----
  # 控制器的 type_mask 未设 IGNORE_VZ（nav_mode=3/NAV_LEVEL 时
  # position.z 与 velocity.z 同时有效），规划器给的 velocity.z
  # 会被当作速度前馈叠加。重规划瞬间 vz 阶跃会把飞机"拽一下"。
  #
  # ① 硬限幅：|vz| <= max_vel_z_out
  max_vel_z_out: 0.30
  # ② 淡入：新轨迹前 vel_blend_time 秒内，参考速度从"生成时的实际速度"
  #    线性过渡到轨迹速度，消除阶跃。0 = 关闭。
  vel_blend_time: 0.35

  # ---- 曲线优化：根源性改进（v1.2）----
  #
  # ① 控制点间距 [m]。必须 < 障碍特征尺寸。
  #    柱阵间距 1.2m 时，0.6m 间距会让一个控制点跨过整个转弯
  #    → B 样条过冲穿进柱子（实测 min_clearance=0）。
  #    0.30m 保证每个拐弯至少 2 个控制点。
  curve_control_point_spacing: 0.30

  # ② 安全硬投影（PBD 风格）。软惩罚压不过保形项，必须用位置投影：
  #    每步梯度后，把穿过障碍的控制点沿 ∇c 直接推开。
  #    关闭它会退回"软惩罚"，密集场景必然撞。
  curve_enable_projection: true
  curve_projection_iters: 2
  # 240 → 160：投影只用于"把越界控制点推出去"，不需要亚分辨率精度。
  curve_projection_samples: 240

  # ③ 局部居中：用"该横截面能提供的最大间隙"做归一化基准。
  #    全局 ref=1 时，窄通道里 c=0.4 恒有 penalty 6.25、梯度非零，
  #    优化器会持续试图把路径推到不存在的更宽处 → 贴着障碍抖。
  #    用 local_ref 后，c==local_ref 时梯度恰好为 0 → 真正"居中即最优"。
  curve_enable_local_centering: true
  curve_local_scan_radius: 2.0

  # 曲线最大允许曲率 [1/m]。R = 1/kmax。
  #
  # ★ 2026-11-14 改为**分级**，不再硬拒绝：
  #     kmax <= 20            → 正常通过
  #     kmax <= 60 (limit×3)  → 警告但**保留曲线**（速度规划按
  #                             v=sqrt(max_lat_acc/kmax) 自动降速）
  #     kmax >  60            → R<1.7cm，真跟不了，才退回折线
  #
  # 为什么改（实测 /tmp/azj_flight_20261114_130456）：
  #   `curve rejected: kmax=22.0075 > limit 20` —— 只超 10% 就丢掉整条曲线，
  #   换回来的折线 min_clearance 只有 **0.111m**（robot_radius=0.30），
  #   比曲线危险得多；而曲线是通过了安全校验（mc>=0.27m）的。
  #   为"曲率好看"牺牲安全指标，与安全优先的理念矛盾。
  #   kmax=22 → 限速 0.23 m/s，对 1.5m 短路径完全可接受。
  # 20 → R=0.05m。速度规划会按 max_lat_acc 自动降速
  # （v = sqrt(max_lat_acc/kmax) = sqrt(1.2/20) = 0.24 m/s），
  # 所以高曲率本身不等于不安全。
  # 设太小（如 5 → R=0.2m）会在 raicom 紧缝里频繁退回折线
  # （实测 kmax≈12.5，"2D 没有曲线优化"就是这个原因）。
  max_curvature: 20.0

  # 曲率超限的容差倍数（2026-11-14 新增）。
  # kmax 在 (max_curvature, max_curvature×tol] 内 → **保留曲线**（降速跟踪）
  # 超过才退回折线。1.0 = 旧行为（严格硬拒绝）。
  # 默认 3.0 对应 kmax<=60（R>=1.7cm）。
  curvature_tolerance: 3.0

  # 快通道后"快速平滑"的迭代数（2026-11-14 新增）。
  #
  # 常规 curve_iterations=60 实测 0.9~1.1 秒。而 fast path 之后的平滑是
  # 补救性的（飞机还在跟折线飞），越早出曲线越好。快速版约 0.4 秒，
  # 先让合格曲线尽快上线，后续常规重规划（TRAJ_END）再用 60 次精修。
  # 0 = 关闭（快速平滑也用完整迭代）。
  curve_iterations_quick: 80

  # 曲线优化的收敛停滞提前退出（2026-11-14 新增）。
  # 连续 stall 次迭代的代价相对改善 < 1e-4 就停。
  # 实测：窄通道场景 120 → 10 次迭代（94ms），形状无差别；
  #       长通道/绕障场景仍需满迭代（该复杂就复杂）。
  curve_stall_iters: 8

  # ---- 轨迹（时间参数化）----
  # 这些值直接决定喂给控制器的速度/加速度前馈，必须与机体的实际能力匹配。
  max_vel: 1.0              # 最大水平速度 [m/s]
  max_vel_z: 0.6            # 最大垂直速度 [m/s]
  max_acc: 1.5
  max_acc_z: 1.0            # 最大垂直加速度 [m/s^2]
  max_lat_acc: 1.2          # 最大横向(向心)加速度 [m/s^2]，决定转弯限速
                            # 注意：调大它会让转弯更快，但也更容易过冲

  # ---- 安全 ----
  robot_radius: 0.30        # 硬安全半径：clearance 低于它直接拒绝通行
  escape_radius: 0.60       # 起点逃生区（已贴障碍时允许先飞出来）

  # ---- 居中（核心理念）----
  # 代价 = 长度 * (1 + w * (ref / clamp(c, ·, cap))^alpha)
  #
  # 调参参考（离线实测）：
  #   长通道 10m：w=0.05 → 横向偏移 0.236m→0.008m，长度 +0.75%
  #   短缝 1.6m ：w=0.20 → 偏移 0.481m→0.027m，长度 +2.5%
  # 惩罚沿路径累积，窄而短的通道需要更大的 w。
  clearance_weight: 0.15    # w：0 = 纯最短（EGO 行为）
  clearance_ref: 1.0        # ref：归一化基准 [m]
  clearance_cap: 2.0        # cap：超过此 clearance 不再奖励，防绕远
  alpha: 2.0                # 居中锐度

  # ---- 搜索范围 ----
  # A* 搜索框 = 起终点包围盒 + 该外扩 [m]。
  #
  # 给足余量：路径常需要绕到起终点包围盒之外（绕过整面墙、从房间另一端过去）。
  # 太小会 NO_PATH —— 但那是"搜索框不够"而不是"真的没路"。
  # raicom 是 4x4m 房间，2.5 的外扩 + 起终点跨度 → 覆盖全房间。
  box_margin_x: 2.5
  box_margin_y: 2.5
  # z 方向不用给大：有 z_band 硬约束（默认 0.40）限着，
  # 给 1.5 会白算几十层空层。0.8 足够容纳 0.4 高度带 + 余量。
  box_margin_z: 0.8
  goal_tolerance: 0.30
  max_expansions: 400000

  # ---- 输出 ----
  goal_topic: "/move_base_simple/goal"
  path_topic: "/azj/path"
  marker_topic: "/azj/path_marker"
  frame_id: "map"

  # ---- 未知区域策略 ----
  #
  # ⚠ 这一项踩过大坑：早期版本把 UNKNOWN 直接当障碍（返回 -1），结果
  #   雷达装在机体上、看不到自己所在体素 → 那里必然是 UNKNOWN →
  #   飞机永远报 "start is inside an obstacle"，一次都规划不出来。
  #
  # 正确语义：UNKNOWN = "没探测过"，不等于"有障碍"。
  #   而且空地图/未探测区 ESDF 会返回 0，所以**不能**先算 ESDF 再取 min。
  #
  unknown_as_free: false            # true = 未知区直接按 free_clearance_if_unknown 处理
  free_clearance_if_unknown: 0.5    # 仅当 unknown_as_free=true 时生效

  # 未知区的 clearance 取值（unknown_as_free=false 时用）。
  #   cap >= robot_radius → 未知区可通行，但代价高（规划器倾向已知区域）
  #   cap <  robot_radius → 未知区视为不可通行（更保守）
  # 默认 0.5 > robot_radius 0.3，保证"雷达盲区里的起点"能起步。
  # ⚠ 不要设得比 robot_radius 大太多：UNKNOWN 若被高估成"比已知区域更宽敞"，
  #   A* 会主动往没探测过的地方（常见是地面/天花板附近）钻。
  #   实测 0.5 时路径从 0.52 降到 0.04，就是因为低处 UNKNOWN 被算成 0.5 > 0.3。
  #   取 robot_radius 附近即可：既能起步，又不鼓励探索未探测区。
  unknown_clearance_cap: 0.32
